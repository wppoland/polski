name: Accessibility

on:
    push:
        branches: [main]
        paths:
            - 'src/Service/Withdrawal**'
            - 'src/Service/Guest**'
            - 'src/Service/Annex**'
            - 'src/Service/Digital**'
            - 'src/Service/MyAccount**'
            - 'src/Admin/Withdrawal**'
            - 'templates/forms/**'
            - 'templates/emails/**'
            - 'assets/css/withdrawal.css'
            - 'assets/js/withdrawal-form.js'
            - 'tests/E2E/withdrawal-**'
            - 'lighthouserc.json'
            - '.github/workflows/a11y.yml'
    pull_request:
        branches: [main]
    schedule:
        # Nightly run at 02:00 UTC to catch theme/WP-core regressions.
        - cron: '0 2 * * *'
    workflow_dispatch:

concurrency:
    group: a11y-${{ github.ref }}
    cancel-in-progress: true

jobs:
    axe-and-lighthouse:
        name: axe + Lighthouse on /odstapienie/
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
        
            - name: Install dependencies (npm)
              run: npm install

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Install axe + Lighthouse CI (devDeps)
              run: npm install --no-save @axe-core/playwright @lhci/cli

            - name: Install PHP dependencies
              # polski boots against wppoland/storefront-kit, which lives in
              # vendor/. The autoloader's fallback covers the Polski namespace
              # only, so without this step WordPress fatals on the first kit
              # interface and every request returns 500, which is what these two
              # jobs had been timing out on.
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare wp-env (WooCommerce + Polski only)
              run: |
                  rm -f .wp-env.override.json
                  node <<'NODE'
                  const fs = require('fs');
                  const j = JSON.parse(fs.readFileSync('.wp-env.json', 'utf8'));
                  j.plugins = [
                    'https://downloads.wordpress.org/plugin/woocommerce.zip',
                    '.',
                  ];
                  fs.writeFileSync('.wp-env.json', JSON.stringify(j, null, '\t') + '\n');
                  NODE

            - name: Start wp-env
              run: |
                  npm run env:start
                  # wp-env prints "Done" before WordPress has finished installing, so
                  # wait for the login screen to actually answer. Any HTTP response
                  # counts: a redirect to the installer means the container is up and
                  # about to be ready, while curl -sf treated 5xx during boot as a
                  # hard failure. The old 90s budget was set when wp-env start took
                  # about 40s on a runner; it now takes ~87s on its own, so the wait
                  # had no room left and this job had been failing on main since
                  # 29 July with no code change behind it.
                  ready=0
                  for _ in $(seq 1 90); do
                    code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8888/wp-login.php || true)"
                    case "$code" in 200|301|302) ready=1; break;; esac
                    sleep 2
                  done
                  if [ "$ready" != "1" ]; then
                    echo "wp-login.php never answered; last status: ${code:-none}"
                    docker ps
                    docker logs --tail 50 "$(docker ps --filter name=wordpress --format '{{.Names}}' | head -1)" || true
                    exit 1
                  fi

            - name: Seed minimum fixtures
              run: |
                  npx wp-env run cli wp post create --post_type=page \
                    --post_title="Odstąpienie" --post_status=publish --post_name=odstapienie \
                    --post_content='[polski_withdrawal_lookup]'
                  npx wp-env run cli wp option update polski_withdrawal \
                    '{"lookup_page_id":$(npx wp-env run cli wp post list --post_type=page --name=odstapienie --field=ID),"period_days":14}' \
                    --format=json || true

            - name: Run axe-core via Playwright
              run: npm run test:a11y -- --reporter=line
              continue-on-error: false

            - name: Run Lighthouse CI
              run: npm run test:lhci
              continue-on-error: true

            - name: Upload axe + Lighthouse reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: a11y-reports-${{ github.run_id }}
                  path: |
                      reports/lighthouse/**
                      playwright-report/**
                      test-results/**
                  retention-days: 30

            - name: Stop wp-env
              if: always()
              run: npm run env:stop || true

    keyboard-nav:
        name: Keyboard navigation (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
        
            - name: Install dependencies (npm)
              run: npm install

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Install PHP dependencies
              # polski boots against wppoland/storefront-kit, which lives in
              # vendor/. The autoloader's fallback covers the Polski namespace
              # only, so without this step WordPress fatals on the first kit
              # interface and every request returns 500, which is what these two
              # jobs had been timing out on.
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare wp-env (WooCommerce + Polski only)
              run: |
                  rm -f .wp-env.override.json
                  node <<'NODE'
                  const fs = require('fs');
                  const j = JSON.parse(fs.readFileSync('.wp-env.json', 'utf8'));
                  j.plugins = [
                    'https://downloads.wordpress.org/plugin/woocommerce.zip',
                    '.',
                  ];
                  fs.writeFileSync('.wp-env.json', JSON.stringify(j, null, '\t') + '\n');
                  NODE

            - name: Start wp-env
              run: |
                  npm run env:start
                  # wp-env prints "Done" before WordPress has finished installing, so
                  # wait for the login screen to actually answer. Any HTTP response
                  # counts: a redirect to the installer means the container is up and
                  # about to be ready, while curl -sf treated 5xx during boot as a
                  # hard failure. The old 90s budget was set when wp-env start took
                  # about 40s on a runner; it now takes ~87s on its own, so the wait
                  # had no room left and this job had been failing on main since
                  # 29 July with no code change behind it.
                  ready=0
                  for _ in $(seq 1 90); do
                    code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8888/wp-login.php || true)"
                    case "$code" in 200|301|302) ready=1; break;; esac
                    sleep 2
                  done
                  if [ "$ready" != "1" ]; then
                    echo "wp-login.php never answered; last status: ${code:-none}"
                    docker ps
                    docker logs --tail 50 "$(docker ps --filter name=wordpress --format '{{.Names}}' | head -1)" || true
                    exit 1
                  fi

            - name: Run keyboard navigation tests
              run: npx playwright test withdrawal-guest-flow --project=chromium --reporter=line

            - name: Stop wp-env
              if: always()
              run: npm run env:stop || true
